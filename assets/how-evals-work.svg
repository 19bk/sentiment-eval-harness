<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="800" height="290" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-size="30" font-weight="700" fill="#1e1e1e">How an eval works</text>
  <text x="400" y="70" text-anchor="middle" font-size="16" fill="#757575">Find where it breaks. Turn every failure into a test.</text>

  <rect x="30" y="108" width="150" height="74" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text x="105" y="141" text-anchor="middle" font-size="17" fill="#1e1e1e">Labeled</text>
  <text x="105" y="163" text-anchor="middle" font-size="17" fill="#1e1e1e">dataset</text>

  <line x1="182" y1="145" x2="221" y2="145" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="225" y="108" width="150" height="74" rx="10" fill="#d0bfff" stroke="#7048e8" stroke-width="2"/>
  <text x="300" y="141" text-anchor="middle" font-size="17" fill="#1e1e1e">Run the</text>
  <text x="300" y="163" text-anchor="middle" font-size="17" fill="#1e1e1e">system</text>

  <line x1="377" y1="145" x2="416" y2="145" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="420" y="108" width="150" height="74" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/>
  <text x="495" y="141" text-anchor="middle" font-size="17" fill="#1e1e1e">Score</text>
  <text x="495" y="163" text-anchor="middle" font-size="17" fill="#1e1e1e">by slice</text>

  <line x1="572" y1="145" x2="611" y2="145" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="615" y="108" width="150" height="74" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
  <text x="690" y="141" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1e1e">Gate</text>
  <text x="690" y="164" text-anchor="middle" font-size="15" fill="#1e1e1e">ship or block</text>

  <path d="M690,182 L690,248 L105,248 L105,186" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ah)"/>
  <text x="400" y="240" text-anchor="middle" font-size="16" fill="#e8590c">every failure becomes a new test case</text>
</svg>
