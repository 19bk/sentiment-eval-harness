<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>

  <text x="500" y="60" text-anchor="middle" font-size="42" font-weight="700" fill="#1e1e1e">How an eval works</text>

  <rect x="40" y="150" width="190" height="96" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="3"/>
  <text x="135" y="192" text-anchor="middle" font-size="20" fill="#1e1e1e">Examples</text>
  <text x="135" y="218" text-anchor="middle" font-size="20" fill="#1e1e1e">+ answers</text>

  <line x1="232" y1="198" x2="284" y2="198" stroke="#1e1e1e" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="287" y="150" width="190" height="96" rx="12" fill="#d0bfff" stroke="#7048e8" stroke-width="3"/>
  <text x="382" y="205" text-anchor="middle" font-size="20" fill="#1e1e1e">Run the AI</text>

  <line x1="479" y1="198" x2="531" y2="198" stroke="#1e1e1e" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="534" y="150" width="190" height="96" rx="12" fill="#c3fae8" stroke="#0c8599" stroke-width="3"/>
  <text x="629" y="192" text-anchor="middle" font-size="20" fill="#1e1e1e">Score</text>
  <text x="629" y="218" text-anchor="middle" font-size="20" fill="#1e1e1e">by type</text>

  <line x1="726" y1="198" x2="778" y2="198" stroke="#1e1e1e" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="781" y="150" width="190" height="96" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="3"/>
  <text x="876" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">Ship</text>
  <text x="876" y="218" text-anchor="middle" font-size="20" fill="#1e1e1e">or block</text>

  <path d="M876,246 L876,330 L135,330 L135,248" fill="none" stroke="#e8590c" stroke-width="3" marker-end="url(#ahr)"/>
  <text x="505" y="320" text-anchor="middle" font-size="22" font-weight="700" fill="#e8590c">every failure becomes a new test</text>
</svg>
