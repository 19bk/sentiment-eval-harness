<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>

  <text x="500" y="56" text-anchor="middle" font-size="36" font-weight="700" fill="#1e1e1e">The demo said 100%. The real test said 50%.</text>
  <text x="500" y="92" text-anchor="middle" font-size="19" fill="#757575">Same tool. The demo only showed the easy sentences.</text>

  <!-- left: first version -->
  <text x="90" y="150" font-size="22" font-weight="700" fill="#1e1e1e">First version</text>
  <text x="215" y="196" text-anchor="end" font-size="19" fill="#495057">easy</text>
  <rect x="230" y="176" width="190" height="28" rx="7" fill="#e9ecef"/>
  <rect x="230" y="176" width="190" height="28" rx="7" fill="#37b24d"/>
  <text x="432" y="197" font-size="20" font-weight="700" fill="#2f9e44">100%</text>
  <text x="215" y="240" text-anchor="end" font-size="19" fill="#495057">"not" ones</text>
  <rect x="230" y="220" width="190" height="28" rx="7" fill="#e9ecef"/>
  <text x="432" y="241" font-size="20" font-weight="700" fill="#e03131">0%</text>
  <text x="215" y="284" text-anchor="end" font-size="19" fill="#495057">sarcasm</text>
  <rect x="230" y="264" width="190" height="28" rx="7" fill="#e9ecef"/>
  <text x="432" y="285" font-size="20" font-weight="700" fill="#e03131">0%</text>
  <text x="230" y="378" font-size="64" font-weight="700" fill="#e03131">50%</text>
  <text x="232" y="410" font-size="18" fill="#868e96">overall &#183; every case</text>

  <!-- right: after fix -->
  <text x="560" y="150" font-size="22" font-weight="700" fill="#1e1e1e">After a 3-line fix</text>
  <text x="685" y="196" text-anchor="end" font-size="19" fill="#495057">easy</text>
  <rect x="700" y="176" width="190" height="28" rx="7" fill="#e9ecef"/>
  <rect x="700" y="176" width="190" height="28" rx="7" fill="#37b24d"/>
  <text x="902" y="197" font-size="20" font-weight="700" fill="#2f9e44">100%</text>
  <text x="685" y="240" text-anchor="end" font-size="19" fill="#495057">"not" ones</text>
  <rect x="700" y="220" width="190" height="28" rx="7" fill="#e9ecef"/>
  <rect x="700" y="220" width="190" height="28" rx="7" fill="#37b24d"/>
  <text x="902" y="241" font-size="20" font-weight="700" fill="#2f9e44">100%</text>
  <text x="685" y="284" text-anchor="end" font-size="19" fill="#495057">sarcasm</text>
  <rect x="700" y="264" width="190" height="28" rx="7" fill="#e9ecef"/>
  <text x="902" y="285" font-size="20" font-weight="700" fill="#e03131">0%</text>
  <text x="700" y="378" font-size="64" font-weight="700" fill="#2f9e44">90%</text>
  <text x="702" y="410" font-size="18" fill="#868e96">overall &#183; every case</text>

  <line x1="455" y1="350" x2="665" y2="350" stroke="#1e1e1e" stroke-width="3" marker-end="url(#ah)"/>
  <text x="560" y="338" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">+3 lines</text>

  <text x="500" y="478" text-anchor="middle" font-size="24" font-weight="700" fill="#1e1e1e">An eval tells the truth your demo hides.</text>
  <text x="500" y="510" text-anchor="middle" font-size="15" fill="#868e96">40 example sentences, scored by type  &#183;  github.com/19bk/sentiment-eval-harness</text>
</svg>
