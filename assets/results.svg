<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="820" height="450" fill="#ffffff"/>

  <text x="410" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e1e1e">The demo said 100%. The eval said 50%.</text>
  <text x="410" y="74" text-anchor="middle" font-size="17" fill="#555555">Same classifier. The demo only showed the easy cases.</text>

  <!-- v1 -->
  <text x="50" y="116" font-size="19" font-weight="bold" fill="#1e1e1e">v1: keyword counting</text>
  <rect x="50" y="128" width="240" height="40" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
  <text x="170" y="154" text-anchor="middle" font-size="17" fill="#1e1e1e">easy   100%</text>
  <rect x="50" y="178" width="160" height="40" rx="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
  <text x="130" y="204" text-anchor="middle" font-size="17" fill="#1e1e1e">"not" cases   0%</text>
  <rect x="50" y="228" width="160" height="40" rx="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
  <text x="130" y="254" text-anchor="middle" font-size="17" fill="#1e1e1e">sarcasm   0%</text>
  <rect x="50" y="290" width="265" height="52" rx="6" fill="#ffc9c9" stroke="#e03131" stroke-width="3"/>
  <text x="182" y="322" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e1e1e">Overall: 50%  (FAIL)</text>

  <!-- v2 -->
  <text x="445" y="116" font-size="19" font-weight="bold" fill="#1e1e1e">v2: + negation fix (3 lines)</text>
  <rect x="445" y="128" width="240" height="40" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
  <text x="565" y="154" text-anchor="middle" font-size="17" fill="#1e1e1e">easy   100%</text>
  <rect x="445" y="178" width="240" height="40" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
  <text x="565" y="204" text-anchor="middle" font-size="17" fill="#1e1e1e">"not" cases   100%</text>
  <rect x="445" y="228" width="160" height="40" rx="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
  <text x="525" y="254" text-anchor="middle" font-size="17" fill="#1e1e1e">sarcasm   0%</text>
  <rect x="445" y="290" width="265" height="52" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="3"/>
  <text x="577" y="322" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e1e1e">Overall: 90%  (PASS)</text>

  <line x1="320" y1="316" x2="438" y2="316" stroke="#1e1e1e" stroke-width="2.5"/>
  <polygon points="438,316 428,310 428,322" fill="#1e1e1e"/>
  <text x="379" y="308" text-anchor="middle" font-size="14" fill="#1e1e1e">+3 lines</text>

  <text x="410" y="388" text-anchor="middle" font-size="18" fill="#1e1e1e">An eval tells the truth your demo hides.</text>
  <text x="410" y="418" text-anchor="middle" font-size="13" fill="#777777">40 labeled cases, scored by slice   -   github.com/19bk/sentiment-eval-harness</text>
</svg>
