<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="760" height="372" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <text x="380" y="33" text-anchor="middle" font-size="27" font-weight="700" fill="#1e1e1e">The demo said 100%. The eval said 50%.</text>
  <text x="380" y="59" text-anchor="middle" font-size="15" fill="#757575">Same classifier. The demo only showed the easy cases.</text>

  <!-- v1 -->
  <text x="70" y="100" font-size="16" font-weight="700" fill="#1e1e1e">v1: keyword counting</text>
  <text x="140" y="129" text-anchor="end" font-size="14" fill="#495057">easy</text>
  <rect x="148" y="112" width="150" height="24" rx="6" fill="#e9ecef" stroke="#ced4da"/>
  <rect x="148" y="112" width="150" height="24" rx="6" fill="#37b24d"/>
  <text x="306" y="129" font-size="15" font-weight="700" fill="#2f9e44">100%</text>
  <text x="140" y="163" text-anchor="end" font-size="14" fill="#495057">"not" cases</text>
  <rect x="148" y="146" width="150" height="24" rx="6" fill="#e9ecef" stroke="#ced4da"/>
  <text x="306" y="163" font-size="15" font-weight="700" fill="#e03131">0%</text>
  <text x="140" y="197" text-anchor="end" font-size="14" fill="#495057">sarcasm</text>
  <rect x="148" y="180" width="150" height="24" rx="6" fill="#e9ecef" stroke="#ced4da"/>
  <text x="306" y="197" font-size="15" font-weight="700" fill="#e03131">0%</text>
  <text x="148" y="250" font-size="40" font-weight="700" fill="#e03131">50%</text>
  <text x="148" y="276" font-size="13"><tspan fill="#e03131" font-weight="700">FAIL</tspan><tspan fill="#868e96"> &#183; overall, all cases</tspan></text>

  <!-- v2 -->
  <text x="430" y="100" font-size="16" font-weight="700" fill="#1e1e1e">v2: + negation fix (3 lines)</text>
  <text x="500" y="129" text-anchor="end" font-size="14" fill="#495057">easy</text>
  <rect x="508" y="112" width="150" height="24" rx="6" fill="#e9ecef" stroke="#ced4da"/>
  <rect x="508" y="112" width="150" height="24" rx="6" fill="#37b24d"/>
  <text x="666" y="129" font-size="15" font-weight="700" fill="#2f9e44">100%</text>
  <text x="500" y="163" text-anchor="end" font-size="14" fill="#495057">"not" cases</text>
  <rect x="508" y="146" width="150" height="24" rx="6" fill="#e9ecef" stroke="#ced4da"/>
  <rect x="508" y="146" width="150" height="24" rx="6" fill="#37b24d"/>
  <text x="666" y="163" font-size="15" font-weight="700" fill="#2f9e44">100%</text>
  <text x="500" y="197" text-anchor="end" font-size="14" fill="#495057">sarcasm</text>
  <rect x="508" y="180" width="150" height="24" rx="6" fill="#e9ecef" stroke="#ced4da"/>
  <text x="666" y="197" font-size="15" font-weight="700" fill="#e03131">0%</text>
  <text x="508" y="250" font-size="40" font-weight="700" fill="#2f9e44">90%</text>
  <text x="508" y="276" font-size="13"><tspan fill="#2f9e44" font-weight="700">PASS</tspan><tspan fill="#868e96"> &#183; overall, all cases</tspan></text>

  <line x1="300" y1="234" x2="470" y2="234" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
  <text x="385" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1e1e">+3 lines</text>

  <text x="380" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1e1e">An eval tells the truth your demo hides.</text>
  <text x="380" y="344" text-anchor="middle" font-size="12.5" fill="#868e96">40 labeled cases, scored by slice  &#183;  github.com/19bk/sentiment-eval-harness</text>
</svg>
