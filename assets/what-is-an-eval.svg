<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="760" height="290" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <text x="380" y="42" text-anchor="middle" font-size="30" font-weight="700" fill="#1e1e1e">What is an eval?</text>
  <text x="380" y="72" text-anchor="middle" font-size="16" fill="#757575">It scores the AI against known answers.</text>

  <rect x="60" y="120" width="200" height="86" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text x="160" y="157" text-anchor="middle" font-size="17" fill="#1e1e1e">20 examples with</text>
  <text x="160" y="180" text-anchor="middle" font-size="17" fill="#1e1e1e">known answers</text>

  <line x1="262" y1="163" x2="316" y2="163" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="320" y="132" width="140" height="62" rx="10" fill="#d0bfff" stroke="#7048e8" stroke-width="2"/>
  <text x="390" y="170" text-anchor="middle" font-size="18" fill="#1e1e1e">Run the AI</text>

  <line x1="462" y1="163" x2="516" y2="163" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="520" y="120" width="200" height="86" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
  <text x="620" y="154" text-anchor="middle" font-size="17" fill="#1e1e1e">Score</text>
  <text x="620" y="182" text-anchor="middle" font-size="19" font-weight="700" fill="#1e1e1e">17 / 20 = 85%</text>

  <text x="380" y="252" text-anchor="middle" font-size="16" fill="#1e1e1e">A demo shows what it gets right. An eval shows what it gets wrong.</text>
</svg>
